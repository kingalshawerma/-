<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع مغلق</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            text-align: center;
        }

        .container {
            padding: 35px 25px;
            width: 100%;
            max-width: 400px;
            background: #273449;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff5555;
            font-size: 30px;
            margin: 0 0 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            color: #e5e7eb;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #4b252b;
            color: #ff7777;
            border-radius: 25px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="icon" aria-hidden="true">🔒</div>
        <h1>الموقع مغلق حالياً</h1>
        <p>
            نعتذر منكم، الموقع مغلق في الوقت الحالي.
            <br>
            يرجى العودة لاحقاً.
        </p>
        <div class="status">● مغلق الآن</div>
    </main>
</body>
</html>
